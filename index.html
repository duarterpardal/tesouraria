<style>
  .budget-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
    font-family: Arial, sans-serif;
  }
  .budget-card {
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 15px;
    background: #f9f9f9;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  .budget-card h3 { margin-top: 0; color: #333; }
  .progress-container {
    width: 100%;
    background-color: #e0e0e0;
    border-radius: 4px;
    margin: 10px 0;
    height: 20px;
  }
  .progress-bar {
    height: 100%;
    border-radius: 4px;
    text-align: center;
    color: white;
    font-size: 12px;
    line-height: 20px;
    transition: width 0.4s ease;
  }
</style>

<div id="budgets-container" class="budget-grid">A carregar os orçamentos do AeroTéc em tempo real...</div>

<script>
  const apiUrl = 'https://script.google.com/macros/s/AKfycbyDCt9x-x-HI6XHZPC7rTa1eRogEYBNhO7_AdowXSwDcVxxaMfXV9hmjCUGj45VMaY/exec';

  fetch(apiUrl)
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('budgets-container');
      container.innerHTML = ''; 

      data.forEach(proj => {
        const inicial = parseFloat(proj.inicial);
        const patrocinios = parseFloat(proj.patrocinios);
        const gasto = parseFloat(proj.gasto);
        const saldo = parseFloat(proj.saldo);
        
        const orcamentoTotal = inicial + patrocinios;
        let percentagem = 0;
        
        if (orcamentoTotal > 0) {
          percentagem = Math.min((gasto / orcamentoTotal) * 100, 100).toFixed(1);
        }

        let corBarra = '#4caf50'; // Verde
        if (percentagem > 80) corBarra = '#f44336'; // Vermelho
        else if (percentagem > 50) corBarra = '#ff9800'; // Laranja

        container.innerHTML += `
          <div class="budget-card">
            <h3>${proj.projeto}</h3>
            <p><strong>Orçamento Inicial:</strong> ${inicial.toFixed(2)}€</p>
            <p><strong>Patrocínios / Entradas:</strong> ${patrocinios.toFixed(2)}€</p>
            <div class="progress-container">
              <div class="progress-bar" style="width: ${percentagem}%; background-color: ${corBarra};">
                ${percentagem}%
              </div>
            </div>
            <p><strong>Despesas Processadas:</strong> ${gasto.toFixed(2)}€</p>
            <p><strong>Saldo Disponível:</strong> ${saldo.toFixed(2)}€</p>
          </div>
        `;
      });
    })
    .catch(error => {
      document.getElementById('budgets-container').innerText = 'Erro ao carregar os dados da tesouraria do AeroTéc.';
      console.error('Erro:', error);
    });
</script>
